name: Stability Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: expo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Run handoff validation
        run: node scripts/validate-handoff.js

      - name: Run repository health check
        run: node scripts/repo-health-check.js

      - name: Run production preflight
        run: node scripts/production-preflight.js

      - name: Run final validation
        run: node scripts/final-validation.js

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Export Android bundle
        run: npx expo export --platform android
